<!DOCTYPE html>
<html lang="en" class="snap">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Personal and commissioned photography projects by Caio Sanfelice — Sanfelice Studio, London.">
  <link rel="icon" type="image/svg+xml" href="assets/images/fav-icon.svg">
  <title>Projects | Sanfelice Studio</title>
  <!-- Bootstrap 5.3.9 CSS (grid, utility classes, modal). Loaded before style.css so our own CSS can override it -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400..800;1,400..800&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <!-- ===== Header / main navigation (components/navbar.html) ===== -->
  <div id="site-navbar"></div>

  <!-- ===== Main content ===== -->
  <main>
    <!-- Hero -->
    <section class="hero position-relative" id="top" aria-labelledby="hero-title">
      <!-- background video (decorative): WebM first, MP4 for browsers without WebM.
           No autoplay here: the VHS effect script below starts it only when the user allows motion;
           the poster shows otherwise -->
      <video class="hero__video position-absolute" muted loop playsinline preload="none" poster="assets/images/home-hero-poster.webp" aria-hidden="true">
        <source src="assets/video/homebackground.webm" type="video/webm">
        <source src="assets/video/homebackground.mp4" type="video/mp4">
      </video>
      <div class="hero__content position-relative">
        <h1 class="hero__title" id="hero-title">Sanfelice Studio</h1>
        <p class="hero__location">London</p>
      </div>
      <a class="hero-scroll position-absolute" href="#work" aria-label="Scroll down for portfolio"><span class="hero-scroll__text" aria-hidden="true"><span class="hero-scroll__flap" style="--i: 0">S</span><span class="hero-scroll__flap" style="--i: 1">c</span><span class="hero-scroll__flap" style="--i: 2">r</span><span class="hero-scroll__flap" style="--i: 3">o</span><span class="hero-scroll__flap" style="--i: 4">l</span><span class="hero-scroll__flap" style="--i: 5">l</span> <span class="hero-scroll__flap" style="--i: 6">d</span><span class="hero-scroll__flap" style="--i: 7">o</span><span class="hero-scroll__flap" style="--i: 8">w</span><span class="hero-scroll__flap" style="--i: 9">n</span> <span class="hero-scroll__flap" style="--i: 10">f</span><span class="hero-scroll__flap" style="--i: 11">o</span><span class="hero-scroll__flap" style="--i: 12">r</span> <span class="hero-scroll__flap" style="--i: 13">p</span><span class="hero-scroll__flap" style="--i: 14">o</span><span class="hero-scroll__flap" style="--i: 15">r</span><span class="hero-scroll__flap" style="--i: 16">t</span><span class="hero-scroll__flap" style="--i: 17">f</span><span class="hero-scroll__flap" style="--i: 18">o</span><span class="hero-scroll__flap" style="--i: 19">l</span><span class="hero-scroll__flap" style="--i: 20">i</span><span class="hero-scroll__flap" style="--i: 21">o</span></span></a>
      <span class="hero__plus hero__plus--top-left position-absolute" aria-hidden="true">+</span>
      <span class="hero__plus hero__plus--top-right position-absolute" aria-hidden="true">+</span>
      <span class="hero__plus hero__plus--left position-absolute" aria-hidden="true">+</span>
      <span class="hero__plus hero__plus--right position-absolute" aria-hidden="true">+</span>
    </section>

    <!-- Gallery -->
    <section class="section gallery-section gallery-page" id="work" aria-labelledby="gallery-heading">
      <nav class="gallery-categories" aria-label="Gallery categories">
        <ul class="gallery-category-list">
          <li class="gallery-category-item">
            <a class="gallery-category-link" href="portraits.html">Portraits</a>
            <span class="gallery-category-separator" aria-hidden="true">·</span>
          </li>
          <li class="gallery-category-item">
            <a class="gallery-category-link" href="editorials.html">Editorials</a>
            <span class="gallery-category-separator" aria-hidden="true">·</span>
          </li>
          <li class="gallery-category-item">
            <h2 class="gallery-category-heading" id="gallery-heading">
              <a class="gallery-category-link" href="projects.html" aria-current="page">
                <span class="asterisk" aria-hidden="true">✱</span><span>Projects</span>
              </a>
            </h2>
          </li>
        </ul>
      </nav>
      <!-- Bootstrap grid: 2 photos per row on phones, 3 from md (768px); gutter g-3, g-lg-4 from 992px -->
      <div class="gallery-grid row row-cols-2 row-cols-md-3 g-3 g-lg-4">
        <div class="col">
          <figure class="gallery-card position-relative">
            <img class="d-block w-100 h-100 object-fit-cover" src="assets/images/project-embrace-bw.webp" alt="Black-and-white portrait of two shirtless men posing close together, one with a buzz cut and an ear cuff, the other with an afro, his arm wrapped around the first" loading="lazy">
            <figcaption class="gallery-card__label position-absolute">Projects</figcaption>
          </figure>
        </div>
        <div class="col">
          <figure class="gallery-card position-relative">
            <img class="d-block w-100 h-100 object-fit-cover" src="assets/images/project-hourglass-feathers.webp" alt="Portrait of a woman with very long black hair in a black feather headdress with jewelled details and red lips, holding a red sand hourglass, against a dark blue painted backdrop" loading="lazy">
            <figcaption class="gallery-card__label position-absolute">Projects</figcaption>
          </figure>
        </div>
        <div class="col">
          <figure class="gallery-card position-relative">
            <img class="d-block w-100 h-100 object-fit-cover" src="assets/images/project-golden-halo.webp" alt="Mixed-media portrait of a person with a bowl haircut in front of a gold-leaf halo and handwritten manuscript, with an orange brushstroke running down the face" loading="lazy">
            <figcaption class="gallery-card__label position-absolute">Projects</figcaption>
          </figure>
        </div>
        <div class="col">
          <figure class="gallery-card position-relative">
            <img class="d-block w-100 h-100 object-fit-cover" src="assets/images/project-green-denim.webp" alt="Editorial of a man in black sunglasses and a bright green printed denim jacket and jeans, worn open over a bare chest with a silver chain, against a cobalt blue backdrop" loading="lazy">
            <figcaption class="gallery-card__label position-absolute">Projects</figcaption>
          </figure>
        </div>
        <div class="col">
          <figure class="gallery-card position-relative">
            <img class="d-block w-100 h-100 object-fit-cover" src="assets/images/project-fringe-dress.webp" alt="Editorial of a woman with a dark bob in a burgundy fringed dress and black knee-high boots, mid-stride, against an iridescent backdrop" loading="lazy">
            <figcaption class="gallery-card__label position-absolute">Projects</figcaption>
          </figure>
        </div>
        <div class="col">
          <figure class="gallery-card position-relative">
            <img class="d-block w-100 h-100 object-fit-cover" src="assets/images/project-golden-horns.webp" alt="Long-exposure portrait of a woman with blue-painted skin and gold horns, holding them above her head, with streaks of golden light trailing beside her black robe against a dark blue backdrop" loading="lazy">
            <figcaption class="gallery-card__label position-absolute">Projects</figcaption>
          </figure>
        </div>
        <div class="col">
          <figure class="gallery-card position-relative">
            <img class="d-block w-100 h-100 object-fit-cover" src="assets/images/project-sky-airplane.webp" alt="Low-angle portrait of a person with windswept auburn hair in a pale blue blazer against a cloudy sky, with an airplane flying overhead" loading="lazy">
            <figcaption class="gallery-card__label position-absolute">Projects</figcaption>
          </figure>
        </div>
        <div class="col">
          <figure class="gallery-card position-relative">
            <img class="d-block w-100 h-100 object-fit-cover" src="assets/images/project-tuxedo-car.webp" alt="Black-and-white portrait of a man in a white tuxedo jacket with black lapels, resting his head on his hand by a car window" loading="lazy">
            <figcaption class="gallery-card__label position-absolute">Projects</figcaption>
          </figure>
        </div>
        <div class="col">
          <figure class="gallery-card position-relative">
            <img class="d-block w-100 h-100 object-fit-cover" src="assets/images/project-beard-beanie.webp" alt="Close-up portrait of a man with a full dark beard, an olive beanie and chest tattoos, looking over his shoulder against a turquoise backdrop" loading="lazy">
            <figcaption class="gallery-card__label position-absolute">Projects</figcaption>
          </figure>
        </div>
      </div>
    </section>
  </main>

  <!-- ===== Footer (components/footer.html) ===== -->
  <div id="site-footer"></div>
<!-- Shared navbar + footer -->
<!-- Bootstrap 5.3.9 JS bundle: runs the Modal component used by the photo lightbox -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
<script src="assets/js/components.js"></script>
<!-- Hero: VHS + glitch + analog noise effect (WebGL) on the background video -->
<script src="assets/js/vhs-glitch-bg.js"></script>
<script>
  // Only when the user allows motion; with "reduce motion" on, the still poster stays
  if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    const heroVideo = document.querySelector(".hero__video");
    heroVideo.preload = "auto";
    VhsGlitch(heroVideo);
  }
</script>
</body>
</html>
