<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Personal and commissioned photography projects by Caio Sanfelice — Sanfelice Studio, London.">
  <link rel="icon" type="image/svg+xml" href="assets/images/fav-icon.svg">
  <title>Projects | Sanfelice Studio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400..800;1,400..800&display=swap');
  </style>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <!-- ===== Header / main navigation (components/navbar.html) ===== -->
  <div id="site-navbar"></div>

  <!-- ===== Main content ===== -->
  <main>
    <!-- Hero -->
    <section class="hero" id="top" aria-labelledby="hero-title">
      <div class="hero__content">
        <h1 class="hero__title" id="hero-title">Sanfelice Studio</h1>
        <p class="hero__location">London</p>
      </div>
      <a class="hero-scroll" href="#work">Scroll down for portfolio</a>
      <span class="hero__plus hero__plus--top-left" aria-hidden="true">+</span>
      <span class="hero__plus hero__plus--top-right" aria-hidden="true">+</span>
      <span class="hero__plus hero__plus--left" aria-hidden="true">+</span>
      <span class="hero__plus hero__plus--right" aria-hidden="true">+</span>
    </section>

    <!-- Gallery -->
    <section class="section gallery-section gallery-page" id="work" aria-labelledby="gallery-heading">
      <nav class="gallery-categories" aria-label="Gallery categories">
        <ul class="gallery-category-list">
          <li class="gallery-category-item">
            <a class="gallery-category-link" href="portraits.html">Portraits</a>
            <span class="gallery-category-separator" aria-hidden="true">·</span>
          </li>
          <li class="gallery-category-item">
            <a class="gallery-category-link" href="editorials.html">Editorials</a>
            <span class="gallery-category-separator" aria-hidden="true">·</span>
          </li>
          <li class="gallery-category-item">
            <h2 class="gallery-category-heading" id="gallery-heading">
              <a class="gallery-category-link" href="projects.html" aria-current="page">
                <span class="asterisk" aria-hidden="true">✱</span><span>Projects</span>
              </a>
            </h2>
          </li>
        </ul>
      </nav>
      <div class="grid">
        <figure class="card">
          <img src="assets/images/project-embrace-bw.jpg" alt="Black-and-white portrait of two shirtless men posing close together, one with a buzz cut and an ear cuff, the other with an afro, his arm wrapped around the first" loading="lazy">
          <figcaption class="card__label">Projects</figcaption>
        </figure>
        <figure class="card">
          <img src="assets/images/project-hourglass-feathers.jpg" alt="Portrait of a woman with very long black hair in a black feather headdress with jewelled details and red lips, holding a red sand hourglass, against a dark blue painted backdrop" loading="lazy">
          <figcaption class="card__label">Projects</figcaption>
        </figure>
         <figure class="card">
          <img src="assets/images/project-golden-halo.jpg" alt="Mixed-media portrait of a person with a bowl haircut in front of a gold-leaf halo and handwritten manuscript, with an orange brushstroke running down the face" loading="lazy">
          <figcaption class="card__label">Projects</figcaption>
        </figure>
        <figure class="card">
          <img src="assets/images/project-green-denim.jpg" alt="Editorial of a man in black sunglasses and a bright green printed denim jacket and jeans, worn open over a bare chest with a silver chain, against a cobalt blue backdrop" loading="lazy">
          <figcaption class="card__label">Projects</figcaption>
        </figure>
        <figure class="card">
          <img src="assets/images/project-fringe-dress.jpg" alt="Editorial of a woman with a dark bob in a burgundy fringed dress and black knee-high boots, mid-stride, against an iridescent backdrop" loading="lazy">
          <figcaption class="card__label">Projects</figcaption>
        </figure>
       <figure class="card">
          <img src="assets/images/project-golden-horns.jpg" alt="Long-exposure portrait of a woman with blue-painted skin and gold horns, holding them above her head, with streaks of golden light trailing beside her black robe against a dark blue backdrop" loading="lazy">
          <figcaption class="card__label">Projects</figcaption>
        </figure>
        <figure class="card">
          <img src="assets/images/project-sky-airplane.jpg" alt="Low-angle portrait of a person with windswept auburn hair in a pale blue blazer against a cloudy sky, with an airplane flying overhead" loading="lazy">
          <figcaption class="card__label">Projects</figcaption>
        </figure>
        <figure class="card">
          <img src="assets/images/project-tuxedo-car.jpg" alt="Black-and-white portrait of a man in a white tuxedo jacket with black lapels, resting his head on his hand by a car window" loading="lazy">
          <figcaption class="card__label">Projects</figcaption>
        </figure>

        
        <figure class="card">
          <img src="assets/images/project-beard-beanie.jpg" alt="Close-up portrait of a man with a full dark beard, an olive beanie and chest tattoos, looking over his shoulder against a turquoise backdrop" loading="lazy">
          <figcaption class="card__label">Projects</figcaption>
        </figure>
      </div>
    </section>
  </main>

  <!-- ===== Footer (components/footer.html) ===== -->
  <div id="site-footer"></div>
<!-- Shared navbar + footer -->
<!-- Bootstrap JS (photo lightbox modal) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
<script src="assets/js/components.js"></script>
</body>
</html>
