<!DOCTYPE html>
<html lang="en" class="snap">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Get in touch with Sanfelice Studio for portrait, editorial and fashion photography commissions in London.">
  <link rel="icon" type="image/svg+xml" href="assets/images/fav-icon.svg">
  <title>Contact | Sanfelice Studio</title>
  <!-- Bootstrap 5.3.9 CSS (grid, utility classes, modal). Loaded before style.css so our own CSS can override it -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400..800;1,400..800&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<!-- Skip link: hidden until focused with Tab (Bootstrap visually-hidden-focusable) -->
<a class="skip-link visually-hidden-focusable" href="#main">Skip to content</a>
  <!-- ===== Header / main navigation (components/navbar.html) ===== -->
  <div id="site-navbar"></div>

  <!-- ===== Main content ===== -->
  <main id="main" class="contact-page-main position-relative">
    <span class="hero__plus hero__plus--top-left position-absolute" aria-hidden="true">+</span>
    <span class="hero__plus hero__plus--top-right position-absolute" aria-hidden="true">+</span>
    <span class="hero__plus hero__plus--left position-absolute" aria-hidden="true">+</span>
    <span class="hero__plus hero__plus--right position-absolute" aria-hidden="true">+</span>
    <!-- Background: noise texture; the VHS effect (assets/js/vhs-glitch-bg.js) is drawn over it -->
    <img width="800" height="533" id="contact-bg" class="contact-page-bg position-absolute" src="assets/images/contact-background.webp" alt="" aria-hidden="true">
    <!-- Contact card: Bootstrap row. Phones: form on top, map below (order-1 / order-2).
         From lg (992px): two halves, map on the left, form on the right (order-lg-*) -->
    <div class="contact-card row gx-lg-5 gy-4">
      <!-- Contact form -->
      <section class="contact-form-panel col-12 col-lg-6 order-1 order-lg-2" aria-labelledby="contact-title">
        <h1 class="contact-form-title" id="contact-title">
          <span class="contact-form-title__asterisk" aria-hidden="true">*</span>GET IN TOUCH
        </h1>
        <form class="contact-form"
              id="contact-form"
              action="https://api.web3forms.com/submit"
              method="POST">
          <input type="hidden" name="access_key" value="fd4bf087-0cf2-4641-b375-fbeb6849988e">
          <!-- filled in by the "How did you hear about us?" pop-up, sent with the message -->
          <input type="hidden" name="heard_about" id="contact-heard-about">

          <fieldset class="contact-name-group">
            <legend class="contact-field__label">Name (required)</legend>
            <!-- First and last name always side by side (col-6) -->
            <div class="contact-input-row row gx-4">
              <div class="contact-field col-6">
                <label class="visually-hidden" for="contact-first-name">First Name</label>
                <input id="contact-first-name"
                       type="text"
                       name="first_name"
                       autocomplete="given-name"
                       placeholder="First Name…"
                       required>
              </div>
              <div class="contact-field col-6">
                <label class="visually-hidden" for="contact-last-name">Last Name</label>
                <input id="contact-last-name"
                       type="text"
                       name="last_name"
                       autocomplete="family-name"
                       placeholder="Last Name…"
                       required>
              </div>
            </div>
          </fieldset>

          <!-- Email and subject: stacked on phones/tablets, side by side from lg (992px) -->
          <div class="contact-input-row row gx-4 gy-3">
            <div class="contact-field col-12 col-lg-6">
              <label class="contact-field__label" for="contact-email">Email (required)</label>
              <input id="contact-email"
                     type="email"
                     name="email"
                     autocomplete="email"
                     spellcheck="false"
                     required>
            </div>
            <div class="contact-field col-12 col-lg-6">
              <label class="contact-field__label" for="contact-subject">Subject (required)</label>
              <input id="contact-subject"
                     type="text"
                     name="subject"
                     required>
            </div>
          </div>

          <div class="contact-field">
            <label class="contact-field__label" for="contact-message">Message (required)</label>
            <textarea id="contact-message"
                      name="message"
                      rows="1"
                      required></textarea>
          </div>

          <button class="contact-submit" type="submit">Send Message</button>
        </form>
        <p class="contact-form-status"
           id="contact-form-status"
           role="status"
           aria-live="polite"
           hidden></p>
      </section>

      <!-- Map and contact details -->
      <section class="contact-information col-12 col-lg-6 order-2 order-lg-1" aria-label="Location and contact details">
        <iframe class="contact-map"
                src="https://www.google.com/maps?q=66+Norlington+Rd,+London+E10+6LA&amp;output=embed"
                title="Map showing 66 Norlington Road, London E10 6LA"
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"></iframe>
        <div class="contact-details">
          <a class="contact-details__link"
             href="https://wa.me/447453967192"
             target="_blank"
             rel="noopener noreferrer">
            <svg class="icon" viewBox="0 0 448 512" aria-hidden="true" focusable="false"><path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7.9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"/></svg>
            <span>Tel: +44 7453 967192</span>
          </a>
          <a class="contact-details__link" href="mailto:hello@caiosanfelice.com">
            <svg class="icon" viewBox="0 0 512 512" aria-hidden="true" focusable="false"><path d="M64 112c-8.8 0-16 7.2-16 16v22.1L220.5 291.7c20.7 17 50.4 17 71.1 0L464 150.1V128c0-8.8-7.2-16-16-16H64zM48 212.2V384c0 8.8 7.2 16 16 16H448c8.8 0 16-7.2 16-16V212.2L322 328.8c-38.4 31.5-93.7 31.5-132 0L48 212.2zM0 128C0 92.7 28.7 64 64 64H448c35.3 0 64 28.7 64 64V384c0 35.3-28.7 64-64 64H64c-35.3 0-64-28.7-64-64V128z"/></svg>
            <span>hello@caiosanfelice.com</span>
          </a>
          <p>Unit 24, 66 Norlington Rd, London E10 6LA</p>
        </div>
      </section>
    </div>

  </main>
  <!-- "How did you hear about us?" pop-up (Bootstrap Modal + form-check radios).
       Opens the first time a form field gets focus; once answered, the form can be filled in -->
  <div class="modal fade heard-modal" id="heard-about-modal" tabindex="-1" role="dialog" aria-labelledby="heard-about-title" aria-hidden="true" data-bs-theme="dark">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content heard-modal__content">
        <button type="button" class="btn-close heard-modal__close" data-bs-dismiss="modal" aria-label="Close"></button>
        <form class="heard-modal__form" id="heard-about-form">
          <h2 class="heard-modal__title" id="heard-about-title">
            <span class="contact-form-title__asterisk" aria-hidden="true">*</span>How did you hear about us?
          </h2>
          <fieldset class="heard-modal__options">
            <legend class="visually-hidden">How did you hear about us?</legend>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="heard" id="heard-google" value="Google" required>
              <label class="form-check-label" for="heard-google">Google</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="heard" id="heard-social" value="Social media">
              <label class="form-check-label" for="heard-social">Social media</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="heard" id="heard-friend" value="Friend / colleague">
              <label class="form-check-label" for="heard-friend">Friend / colleague</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="heard" id="heard-ads" value="Advertising">
              <label class="form-check-label" for="heard-ads">Advertising</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="heard" id="heard-other" value="Other">
              <label class="form-check-label" for="heard-other">Other</label>
            </div>
          </fieldset>
          <button class="contact-submit heard-modal__submit" type="submit">Continue</button>
        </form>
      </div>
    </div>
  </div>

  <!-- ===== Footer (components/footer.html) ===== -->
  <div id="site-footer"></div>
  <!-- Bootstrap 5.3.9 JS bundle: runs the Modal component used by the "How did you hear about us?" pop-up -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
  <!-- Page script -->
  <script>
    const contactForm = document.querySelector("#contact-form");

    // "How did you hear about us?" pop-up: shown the first time any field of the form gets focus.
    // After an answer, the pop-up closes and the cursor goes back to the field the person chose.
    const heardModalEl = document.querySelector("#heard-about-modal");
    const heardForm = document.querySelector("#heard-about-form");
    const heardInput = document.querySelector("#contact-heard-about");
    if (window.bootstrap && heardModalEl) {
      const heardModal = new bootstrap.Modal(heardModalEl);
      let pendingField = null;

      contactForm.addEventListener("focusin", (event) => {
        if (heardInput.value || !event.target.matches("input, textarea, button")) return;
        pendingField = event.target;
        heardModal.show();
      });

      heardForm.addEventListener("submit", (event) => {
        event.preventDefault(); // the radios are required, so the browser asks for a choice first
        heardInput.value = new FormData(heardForm).get("heard");
        heardModal.hide();
      });

      heardModalEl.addEventListener("shown.bs.modal", () => heardForm.querySelector("input").focus());
      heardModalEl.addEventListener("hidden.bs.modal", () => {
        if (heardInput.value) pendingField?.focus();
      });
    }
    const contactStatus = document.querySelector("#contact-form-status");
    const submitButton = contactForm.querySelector('button[type="submit"]');
    const submitLabel = submitButton.textContent;

    contactForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      submitButton.disabled = true;
      submitButton.textContent = "Sending…";
      contactStatus.hidden = true;
      contactStatus.classList.remove("is-error");

      const fields = Object.fromEntries(new FormData(contactForm));
      fields.name = [fields.first_name, fields.last_name].filter(Boolean).join(" ");

      try {
        const response = await fetch(contactForm.action, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify(fields)
        });
        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error(result.message || `Request failed with status ${response.status}`);
        }

        contactForm.hidden = true;
        contactStatus.textContent = "Message sent — I'll get back to you soon.";
        contactStatus.hidden = false;
      } catch (error) {
        console.error("Contact form submission failed:", error);
        contactStatus.textContent = "Something went wrong — please try again.";
        contactStatus.classList.add("is-error");
        contactStatus.hidden = false;
        submitButton.disabled = false;
        submitButton.textContent = submitLabel;
      }
    });
  </script>
<!-- Shared navbar + footer -->
<script src="assets/js/components.js"></script>
<!-- Background: VHS + glitch + analog noise effect (WebGL) over the texture -->
<script src="assets/js/vhs-glitch-bg.js"></script>
<script>
  // Only when the user allows motion; with "reduce motion" on, the still texture stays
  if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    VhsGlitch("#contact-bg");
  }
</script>
</body>
</html>
