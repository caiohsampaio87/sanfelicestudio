<!DOCTYPE html>
<html lang="en" class="snap">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Get in touch with Sanfelice Studio for portrait, editorial and fashion photography commissions in London.">
  <link rel="icon" type="image/svg+xml" href="assets/images/fav-icon.svg">
  <title>Contact | Sanfelice Studio</title>
  <!-- Bootstrap 5.3.9 CSS (grid, utility classes, modal). Loaded before style.css so our own CSS can override it -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400..800;1,400..800&display=swap');
  </style>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <!-- ===== Header / main navigation (components/navbar.html) ===== -->
  <div id="site-navbar"></div>

  <!-- ===== Main content ===== -->
  <main class="contact-page-main position-relative">
    <span class="hero__plus hero__plus--top-left position-absolute" aria-hidden="true">+</span>
    <span class="hero__plus hero__plus--top-right position-absolute" aria-hidden="true">+</span>
    <span class="hero__plus hero__plus--left position-absolute" aria-hidden="true">+</span>
    <span class="hero__plus hero__plus--right position-absolute" aria-hidden="true">+</span>
    <!-- Background: noise texture; the VHS effect (assets/js/vhs-glitch-bg.js) is drawn over it -->
    <img id="contact-bg" class="contact-page-bg position-absolute" src="assets/images/contact-background.jpg" alt="" aria-hidden="true">
    <!-- Contact card: Bootstrap row. Phones: form on top, map below (order-1 / order-2).
         From lg (992px): two halves, map on the left, form on the right (order-lg-*) -->
    <div class="contact-card row gx-lg-5 gy-4">
      <!-- Contact form -->
      <section class="contact-form-panel col-12 col-lg-6 order-1 order-lg-2" aria-labelledby="contact-title">
        <h1 class="contact-form-title" id="contact-title">
          <span class="contact-form-title__asterisk" aria-hidden="true">*</span>GET IN TOUCH
        </h1>
        <form class="contact-form"
              id="contact-form"
              action="https://api.web3forms.com/submit"
              method="POST">
          <input type="hidden" name="access_key" value="fd4bf087-0cf2-4641-b375-fbeb6849988e">

          <fieldset class="contact-name-group">
            <legend class="contact-field__label">Name (required)</legend>
            <!-- First and last name always side by side (col-6) -->
            <div class="contact-input-row row gx-4">
              <div class="contact-field col-6">
                <label class="visually-hidden" for="contact-first-name">First Name</label>
                <input id="contact-first-name"
                       type="text"
                       name="first_name"
                       autocomplete="given-name"
                       placeholder="First Name"
                       required>
              </div>
              <div class="contact-field col-6">
                <label class="visually-hidden" for="contact-last-name">Last Name</label>
                <input id="contact-last-name"
                       type="text"
                       name="last_name"
                       autocomplete="family-name"
                       placeholder="Last Name"
                       required>
              </div>
            </div>
          </fieldset>

          <!-- Email and subject: stacked on phones/tablets, side by side from lg (992px) -->
          <div class="contact-input-row row gx-4 gy-3">
            <div class="contact-field col-12 col-lg-6">
              <label class="contact-field__label" for="contact-email">Email (required)</label>
              <input id="contact-email"
                     type="email"
                     name="email"
                     autocomplete="email"
                     required>
            </div>
            <div class="contact-field col-12 col-lg-6">
              <label class="contact-field__label" for="contact-subject">Subject (required)</label>
              <input id="contact-subject"
                     type="text"
                     name="subject"
                     required>
            </div>
          </div>

          <div class="contact-field">
            <label class="contact-field__label" for="contact-message">Message (required)</label>
            <textarea id="contact-message"
                      name="message"
                      rows="1"
                      required></textarea>
          </div>

          <button class="contact-submit" type="submit">Send message</button>
        </form>
        <p class="contact-form-status"
           id="contact-form-status"
           role="status"
           aria-live="polite"
           hidden></p>
      </section>

      <!-- Map and contact details -->
      <section class="contact-information col-12 col-lg-6 order-2 order-lg-1" aria-label="Location and contact details">
        <iframe class="contact-map"
                src="https://www.google.com/maps?q=66+Norlington+Rd,+London+E10+6LA&amp;output=embed"
                title="Map showing 66 Norlington Road, London E10 6LA"
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"></iframe>
        <div class="contact-details">
          <a class="contact-details__link"
             href="https://wa.me/447453967192"
             target="_blank"
             rel="noopener noreferrer">
            <i class="fa-brands fa-whatsapp" aria-hidden="true"></i>
            <span>Tel: +44 7453 967192</span>
          </a>
          <a class="contact-details__link" href="mailto:hello@caiosanfelice.com">
            <i class="fa-regular fa-envelope" aria-hidden="true"></i>
            <span>hello@caiosanfelice.com</span>
          </a>
          <p>Unit 24, 66 Norlington Rd, London E10 6LA</p>
        </div>
      </section>
    </div>
  </main>
  <!-- ===== Footer (components/footer.html) ===== -->
  <div id="site-footer"></div>
  <!-- Page script -->
  <script>
    const contactForm = document.querySelector("#contact-form");
    const contactStatus = document.querySelector("#contact-form-status");
    const submitButton = contactForm.querySelector('button[type="submit"]');
    const submitLabel = submitButton.textContent;

    contactForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      submitButton.disabled = true;
      submitButton.textContent = "Sending...";
      contactStatus.hidden = true;
      contactStatus.classList.remove("is-error");

      const fields = Object.fromEntries(new FormData(contactForm));
      fields.name = [fields.first_name, fields.last_name].filter(Boolean).join(" ");

      try {
        const response = await fetch(contactForm.action, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify(fields)
        });
        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error(result.message || `Request failed with status ${response.status}`);
        }

        contactForm.hidden = true;
        contactStatus.textContent = "Message sent — I'll get back to you soon.";
        contactStatus.hidden = false;
      } catch (error) {
        console.error("Contact form submission failed:", error);
        contactStatus.textContent = "Something went wrong — please try again.";
        contactStatus.classList.add("is-error");
        contactStatus.hidden = false;
        submitButton.disabled = false;
        submitButton.textContent = submitLabel;
      }
    });
  </script>
<!-- Shared navbar + footer -->
<script src="assets/js/components.js"></script>
<!-- Background: VHS + glitch + analog noise effect (WebGL) over the texture -->
<script src="assets/js/vhs-glitch-bg.js"></script>
<script>
  // Only when the user allows motion; with "reduce motion" on, the still texture stays
  if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    VhsGlitch("#contact-bg");
  }
</script>
</body>
</html>
