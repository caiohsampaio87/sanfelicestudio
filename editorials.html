<!DOCTYPE html>
<html lang="en" class="snap">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Editorial and fashion photography by Caio Sanfelice — Sanfelice Studio, London.">
  <link rel="icon" type="image/svg+xml" href="assets/images/fav-icon.svg">
  <title>Editorials | Sanfelice Studio</title>
  <!-- Bootstrap 5.3.9 CSS (grid, utility classes, modal). Loaded before style.css so our own CSS can override it -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400..800;1,400..800&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<!-- Skip link: hidden until focused with Tab (Bootstrap visually-hidden-focusable) -->
<a class="skip-link visually-hidden-focusable" href="#main">Skip to content</a>
  <!-- ===== Header / main navigation (components/navbar.html) ===== -->
  <div id="site-navbar"></div>

  <!-- ===== Main content ===== -->
  <main id="main">
    <!-- Hero -->
    <section class="hero position-relative" id="top" aria-labelledby="hero-title">
      <!-- background video (decorative): WebM first, MP4 for browsers without WebM.
           No autoplay here: the VHS effect script below starts it only when the user allows motion;
           the poster shows otherwise -->
      <video class="hero__video position-absolute" muted loop playsinline preload="none" poster="assets/images/home-hero-poster.webp" aria-hidden="true">
        <source src="assets/video/homebackground.webm" type="video/webm">
        <source src="assets/video/homebackground.mp4" type="video/mp4">
      </video>
      <div class="hero__content position-relative">
        <h1 class="hero__title" id="hero-title" translate="no">Sanfelice Studio</h1>
        <p class="hero__location">London</p>
      </div>
      <a class="hero-scroll position-absolute" href="#work" aria-label="Scroll down for portfolio"><span class="hero-scroll__text" aria-hidden="true"><span class="hero-scroll__flap" style="--i: 0">S</span><span class="hero-scroll__flap" style="--i: 1">c</span><span class="hero-scroll__flap" style="--i: 2">r</span><span class="hero-scroll__flap" style="--i: 3">o</span><span class="hero-scroll__flap" style="--i: 4">l</span><span class="hero-scroll__flap" style="--i: 5">l</span> <span class="hero-scroll__flap" style="--i: 6">d</span><span class="hero-scroll__flap" style="--i: 7">o</span><span class="hero-scroll__flap" style="--i: 8">w</span><span class="hero-scroll__flap" style="--i: 9">n</span> <span class="hero-scroll__flap" style="--i: 10">f</span><span class="hero-scroll__flap" style="--i: 11">o</span><span class="hero-scroll__flap" style="--i: 12">r</span> <span class="hero-scroll__flap" style="--i: 13">p</span><span class="hero-scroll__flap" style="--i: 14">o</span><span class="hero-scroll__flap" style="--i: 15">r</span><span class="hero-scroll__flap" style="--i: 16">t</span><span class="hero-scroll__flap" style="--i: 17">f</span><span class="hero-scroll__flap" style="--i: 18">o</span><span class="hero-scroll__flap" style="--i: 19">l</span><span class="hero-scroll__flap" style="--i: 20">i</span><span class="hero-scroll__flap" style="--i: 21">o</span></span></a>
      <span class="hero__plus hero__plus--top-left position-absolute" aria-hidden="true">+</span>
      <span class="hero__plus hero__plus--top-right position-absolute" aria-hidden="true">+</span>
      <span class="hero__plus hero__plus--left position-absolute" aria-hidden="true">+</span>
      <span class="hero__plus hero__plus--right position-absolute" aria-hidden="true">+</span>
    </section>

    <!-- Gallery -->
    <section class="section gallery-section gallery-page" id="work" aria-labelledby="gallery-heading">
      <nav class="gallery-categories" aria-label="Gallery categories">
        <ul class="gallery-category-list">
          <li class="gallery-category-item">
            <a class="gallery-category-link" href="portraits.html">Portraits</a>
            <span class="gallery-category-separator" aria-hidden="true">·</span>
          </li>
          <li class="gallery-category-item">
            <h2 class="gallery-category-heading" id="gallery-heading">
              <a class="gallery-category-link" href="editorials.html" aria-current="page">
                <span class="asterisk" aria-hidden="true">✱</span><span>Editorials</span>
              </a>
            </h2>
            <span class="gallery-category-separator" aria-hidden="true">·</span>
          </li>
          <li class="gallery-category-item">
            <a class="gallery-category-link" href="projects.html">Projects</a>
          </li>
        </ul>
      </nav>
      <!-- Bootstrap grid: 2 photos per row on phones, 3 from md (768px); gutter g-3, g-lg-4 from 992px -->
      <div class="gallery-grid row row-cols-2 row-cols-md-3 g-3 g-lg-4">
        <div class="col">
          <figure class="gallery-card position-relative">
            <button class="gallery-card__button" type="button" aria-haspopup="dialog">
              <img width="750" height="1000" class="d-block w-100 h-100 object-fit-cover" src="assets/images/editorial-vogue-italia-turtleneck.webp" alt="Vogue Italia PhotoVogue cover: black-and-white portrait of a man with slicked-back hair in a black turtleneck, head tilted back" loading="lazy">
            </button>
            <figcaption class="gallery-card__label position-absolute">Editorials</figcaption>
          </figure>
        </div>
        <div class="col">
          <figure class="gallery-card position-relative">
            <button class="gallery-card__button" type="button" aria-haspopup="dialog">
              <img width="733" height="977" class="d-block w-100 h-100 object-fit-cover" src="assets/images/editorial-gmaro-transcendence-garden.webp" alt="GMARO Magazine October 2025 cover, &quot;Transcendence Garden&quot;: a woman in a sculptural embroidered floral costume holding a dandelion, hair flying, against a warm painted backdrop" loading="lazy">
            </button>
            <figcaption class="gallery-card__label position-absolute">Editorials</figcaption>
          </figure>
        </div>
        <div class="col">
          <figure class="gallery-card position-relative">
            <button class="gallery-card__button" type="button" aria-haspopup="dialog">
              <img width="900" height="1200" class="d-block w-100 h-100 object-fit-cover" src="assets/images/editorial-laundromat.webp" alt="Editorial of a young man in a white T-shirt, navy jacket and white high-top sneakers, lounging inside the drum of a teal laundromat dryer" loading="lazy">
            </button>
            <figcaption class="gallery-card__label position-absolute">Editorials</figcaption>
          </figure>
        </div>
        <div class="col">
          <figure class="gallery-card position-relative">
            <button class="gallery-card__button" type="button" aria-haspopup="dialog">
              <img width="900" height="1200" class="d-block w-100 h-100 object-fit-cover" src="assets/images/editorial-yellow-crown.webp" alt="Editorial of a shirtless man with a high-top haircut and yellow gloves, outlined with hand-drawn dashed lines and a crown on a bright yellow background" loading="lazy">
            </button>
            <figcaption class="gallery-card__label position-absolute">Editorials</figcaption>
          </figure>
        </div>
        <div class="col">
          <figure class="gallery-card position-relative">
            <button class="gallery-card__button" type="button" aria-haspopup="dialog">
              <img width="461" height="615" class="d-block w-100 h-100 object-fit-cover" src="assets/images/editorial-boys-magazine.webp" alt="Boys Magazine cover, &quot;His Story / Hair Story&quot;: black-and-white portrait of a shirtless young man running a hand through wet hair" loading="lazy">
            </button>
            <figcaption class="gallery-card__label position-absolute">Editorials</figcaption>
          </figure>
        </div>
        <div class="col">
          <figure class="gallery-card position-relative">
            <button class="gallery-card__button" type="button" aria-haspopup="dialog">
              <img width="900" height="1200" class="d-block w-100 h-100 object-fit-cover" src="assets/images/editorial-benneb-visor.webp" alt="BENNEB magazine cover: a shirtless young man in a translucent grey visor against a teal backdrop" loading="lazy">
            </button>
            <figcaption class="gallery-card__label position-absolute">Editorials</figcaption>
          </figure>
        </div>
        <div class="col">
          <figure class="gallery-card position-relative">
            <button class="gallery-card__button" type="button" aria-haspopup="dialog">
              <img width="703" height="938" class="d-block w-100 h-100 object-fit-cover" src="assets/images/editorial-glp-noah.webp" alt="GLP Carreiras cover featuring Noah: black-and-white full-length portrait of a shirtless young man in a feathered headdress, high-waisted black trousers and boots" loading="lazy">
            </button>
            <figcaption class="gallery-card__label position-absolute">Editorials</figcaption>
          </figure>
        </div>
        <div class="col">
          <figure class="gallery-card position-relative">
            <button class="gallery-card__button" type="button" aria-haspopup="dialog">
              <img width="900" height="1200" class="d-block w-100 h-100 object-fit-cover" src="assets/images/editorial-ruffle-shoulders.webp" alt="Full-length editorial of a man with a buzz cut in a black top with oversized ruffled shoulders, lace panels, jeans and combat boots, under blue and pink light" loading="lazy">
            </button>
            <figcaption class="gallery-card__label position-absolute">Editorials</figcaption>
          </figure>
        </div>
        <div class="col">
          <figure class="gallery-card position-relative">
            <button class="gallery-card__button" type="button" aria-haspopup="dialog">
              <img width="900" height="1200" class="d-block w-100 h-100 object-fit-cover" src="assets/images/editorial-feather-dress.webp" alt="Editorial of a woman with arms raised in a black-and-white feather dress, a magenta feather headpiece and pink eye makeup, against a white backdrop" loading="lazy">
            </button>
            <figcaption class="gallery-card__label position-absolute">Editorials</figcaption>
          </figure>
        </div>
      </div>
    </section>
  </main>

  <!-- ===== Footer (components/footer.html) ===== -->
  <div id="site-footer"></div>
<!-- Shared navbar + footer -->
<!-- Bootstrap 5.3.9 JS bundle: runs the Modal component used by the photo lightbox -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
<script src="assets/js/components.js"></script>
<!-- Hero: VHS + glitch + analog noise effect (WebGL) on the background video -->
<script src="assets/js/vhs-glitch-bg.js"></script>
<script>
  // Only when the user allows motion; with "reduce motion" on, the still poster stays
  if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    const heroVideo = document.querySelector(".hero__video");
    heroVideo.preload = "auto";
    VhsGlitch(heroVideo);
  }
</script>
</body>
</html>
