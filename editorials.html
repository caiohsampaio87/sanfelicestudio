<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Editorial and fashion photography by Caio Sanfelice — Sanfelice Studio, London.">
  <link rel="icon" type="image/svg+xml" href="assets/images/fav-icon.svg">
  <title>Editorials | Sanfelice Studio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400..800;1,400..800&display=swap');
  </style>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <!-- ===== Header / main navigation (components/navbar.html) ===== -->
  <div id="site-navbar"></div>

  <!-- ===== Main content ===== -->
  <main>
    <!-- Hero -->
    <section class="hero" id="top" aria-labelledby="hero-title">
      <div class="hero__content">
        <h1 class="hero__title" id="hero-title">Sanfelice Studio</h1>
        <p class="hero__location">London</p>
      </div>
      <a class="hero-scroll" href="#work">Scroll down for portfolio</a>
      <span class="hero__plus hero__plus--top-left" aria-hidden="true">+</span>
      <span class="hero__plus hero__plus--top-right" aria-hidden="true">+</span>
      <span class="hero__plus hero__plus--left" aria-hidden="true">+</span>
      <span class="hero__plus hero__plus--right" aria-hidden="true">+</span>
    </section>

    <!-- Gallery -->
    <section class="section gallery-section gallery-page" id="work" aria-labelledby="gallery-heading">
      <nav class="gallery-categories" aria-label="Gallery categories">
        <ul class="gallery-category-list">
          <li class="gallery-category-item">
            <a class="gallery-category-link" href="portraits.html">Portraits</a>
            <span class="gallery-category-separator" aria-hidden="true">·</span>
          </li>
          <li class="gallery-category-item">
            <h2 class="gallery-category-heading" id="gallery-heading">
              <a class="gallery-category-link" href="editorials.html" aria-current="page">
                <span class="asterisk" aria-hidden="true">✱</span><span>Editorials</span>
              </a>
            </h2>
            <span class="gallery-category-separator" aria-hidden="true">·</span>
          </li>
          <li class="gallery-category-item">
            <a class="gallery-category-link" href="projects.html">Projects</a>
          </li>
        </ul>
      </nav>
      <div class="grid">
        <figure class="card">
          <img src="assets/images/editorial-vogue-italia-turtleneck.jpg" alt="Vogue Italia PhotoVogue cover: black-and-white portrait of a man with slicked-back hair in a black turtleneck, head tilted back" loading="lazy">
          <figcaption class="card__label">Editorials</figcaption>
        </figure>
        <figure class="card">
          <img src="assets/images/editorial-gmaro-transcendence-garden.jpg" alt="GMARO Magazine October 2025 cover, "Transcendence Garden": a woman in a sculptural embroidered floral costume holding a dandelion, hair flying, against a warm painted backdrop" loading="lazy">
          <figcaption class="card__label">Editorials</figcaption>
        </figure>
        <figure class="card">
          <img src="assets/images/editorial-laundromat.jpg" alt="Editorial of a young man in a white T-shirt, navy jacket and white high-top sneakers, lounging inside the drum of a teal laundromat dryer" loading="lazy">
          <figcaption class="card__label">Editorials</figcaption>
        </figure>
        <figure class="card">
          <img src="assets/images/editorial-yellow-crown.jpg" alt="Editorial of a shirtless man with a high-top haircut and yellow gloves, outlined with hand-drawn dashed lines and a crown on a bright yellow background" loading="lazy">
          <figcaption class="card__label">Editorials</figcaption>
        </figure>
        <figure class="card">
          <img src="assets/images/editorial-boys-magazine.jpg" alt="Boys Magazine cover, "His Story / Hair Story": black-and-white portrait of a shirtless young man running a hand through wet hair" loading="lazy">
          <figcaption class="card__label">Editorials</figcaption>
        </figure>
        <figure class="card">
          <img src="assets/images/editorial-benneb-visor.jpg" alt="BENNEB magazine cover: a shirtless young man in a translucent grey visor against a teal backdrop" loading="lazy">
          <figcaption class="card__label">Editorials</figcaption>
        </figure>
        <figure class="card">
          <img src="assets/images/editorial-glp-noah.jpg" alt="GLP Carreiras cover featuring Noah: black-and-white full-length portrait of a shirtless young man in a feathered headdress, high-waisted black trousers and boots" loading="lazy">
          <figcaption class="card__label">Editorials</figcaption>
        </figure>
        <figure class="card">
          <img src="assets/images/editorial-ruffle-shoulders.jpg" alt="Full-length editorial of a man with a buzz cut in a black top with oversized ruffled shoulders, lace panels, jeans and combat boots, under blue and pink light" loading="lazy">
          <figcaption class="card__label">Editorials</figcaption>
        </figure>
        <figure class="card">
          <img src="assets/images/editorial-feather-dress.jpg" alt="Editorial of a woman with arms raised in a black-and-white feather dress, a magenta feather headpiece and pink eye makeup, against a white backdrop" loading="lazy">
          <figcaption class="card__label">Editorials</figcaption>
        </figure>
      </div>
    </section>
  </main>

  <!-- ===== Footer (components/footer.html) ===== -->
  <div id="site-footer"></div>
<!-- Shared navbar + footer -->
<!-- Bootstrap JS (photo lightbox modal) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
<script src="assets/js/components.js"></script>
</body>
</html>
