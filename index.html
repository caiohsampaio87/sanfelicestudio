<!DOCTYPE html>
<html lang="en" class="snap">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sanfelice Studio — portrait and editorial photography by Caio Sanfelice, based in London.">
    <link rel="icon" type="image/svg+xml" href="assets/images/fav-icon.svg">
    <title>Sanfelice Studio</title>


    <!-- Bootstrap link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />


    <!-- Font -->
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400..800;1,400..800&display=swap');
    </style>

   <!-- CSS (after the bootstrap, library, fonts) -->
    <link rel="stylesheet" href="assets/css/style.css">

</head>


<body>

<!-- ===== Header / main navigation (components/navbar.html) ===== -->
<div id="site-navbar"></div>

<!-- ===== Main content ===== -->
<main>
  <!-- Hero -->
  <section class="hero" id="top" aria-labelledby="hero-title">
    <!-- background video (decorative): WebM first, MP4 for browsers without WebM.
         No autoplay here: hero-fx.js starts it only when the user allows motion; the poster shows otherwise -->
    <video class="hero__video" muted loop playsinline preload="none" poster="assets/images/home-hero-poster.jpg" aria-hidden="true">
      <source src="assets/video/homebackground.webm" type="video/webm">
      <source src="assets/video/homebackground.mp4" type="video/mp4">
    </video>
    <!-- analog noise + glitch effect drawn over the video (assets/js/hero-fx.js) -->
    <canvas class="hero__fx" aria-hidden="true"></canvas>
    <div class="hero__content">
      <h1 class="hero__title" id="hero-title">Sanfelice Studio</h1>
      <p class="hero__location">London</p>
    </div>
    <a class="hero-scroll" href="#work">Scroll down for portfolio</a>
    <span class="hero__plus hero__plus--top-left" aria-hidden="true">+</span>
    <span class="hero__plus hero__plus--top-right" aria-hidden="true">+</span>
    <span class="hero__plus hero__plus--left" aria-hidden="true">+</span>
    <span class="hero__plus hero__plus--right" aria-hidden="true">+</span>
  </section>

  <!-- Gallery -->
  <section class="section gallery-section" id="work" aria-labelledby="selected-work-title">
    <h2 class="gallery-title" id="selected-work-title">Selected work</h2>
    <nav class="gallery-categories" aria-label="Gallery categories">
      <ul class="gallery-category-list">
        <li class="gallery-category-item">
          <h3 class="gallery-category-heading">
            <a class="gallery-category-link" href="portraits.html" aria-current="page">
              <span class="asterisk" aria-hidden="true">✱</span><span>Portraits</span>
            </a>
          </h3>
          <span class="gallery-category-separator" aria-hidden="true">·</span>
        </li>
        <li class="gallery-category-item">
          <a class="gallery-category-link" href="editorials.html">Editorials</a>
          <span class="gallery-category-separator" aria-hidden="true">·</span>
        </li>
        <li class="gallery-category-item">
          <a class="gallery-category-link" href="projects.html">Projects</a>
        </li>
      </ul>
    </nav>
    <div class="grid">
      <figure class="card">
        <img src="assets/images/portrait-blue-green-jacket.jpg" alt="Portrait of a man with short hair looking over his shoulder, wearing a textured green jacket and a silver chain, against a cobalt blue backdrop" loading="lazy">
        <figcaption class="card__label">Portraits</figcaption>
      </figure>
      <figure class="card">
        <img src="assets/images/portrait-frida-inspired.jpg" alt="Frida Kahlo-inspired portrait of a woman with red flowers in her braided hair, silver earrings and necklace, an embroidered blouse and a turquoise shawl, against a yellow backdrop" loading="lazy">
        <figcaption class="card__label">Portraits</figcaption>
      </figure>
      <figure class="card">
        <img src="assets/images/portrait-red-turtleneck.jpg" alt="Portrait of a young man with short auburn hair and flushed cheeks, wearing a chunky red turtleneck, against a weathered teal backdrop" loading="lazy">
        <figcaption class="card__label">Portraits</figcaption>
      </figure>
      <figure class="card">
        <img src="assets/images/portrait-blond-earcuff.jpg" alt="Close-up portrait of a young man with tousled blond hair and freckles looking back over his bare shoulder, wearing a silver ear cuff, against a soft beige backdrop" loading="lazy">
        <figcaption class="card__label">Portraits</figcaption>
      </figure>
      <figure class="card">
        <img src="assets/images/portrait-horns-red.jpg" alt="Portrait of a man in a black hood with tall curved horns and a red jacket, hugging his arm and looking back over his shoulder, against a weathered grey backdrop" loading="lazy">
        <figcaption class="card__label">Portraits</figcaption>
        </figure>
      <figure class="card">
        <img src="assets/images/portrait-red-hair-blue.jpg" alt="Portrait of a freckled young man with bright red hair looking back over his bare shoulder, against a turquoise blue backdrop" loading="lazy">
        <figcaption class="card__label">Portraits</figcaption>
      </figure>
      <figure class="card">
        <img src="assets/images/portrait-gothic-bonnet.jpg" alt="Portrait of a woman with long wavy brown hair in a black velvet costume with a sculptural bonnet, sheer sleeves, silver ornaments and insect-like wings, against a mottled cream backdrop" loading="lazy">
        <figcaption class="card__label">Portraits</figcaption>
      </figure>
      <figure class="card">
        <img src="assets/images/portrait-dark-hair-sage.jpg" alt="Close-up portrait of a young man with tousled dark hair and pale blue eyes looking over his bare shoulder, a hand resting on it, against a sage green backdrop" loading="lazy">
        <figcaption class="card__label">Portraits</figcaption>
      </figure>
      <figure class="card">
        <img src="assets/images/portrait-striped-beret.jpg" alt="Black-and-white portrait of a tattooed man in a striped T-shirt and braces, touching the brim of a dark beret" loading="lazy">
        <figcaption class="card__label">Portraits</figcaption>
      </figure>
    </div>
  </section>
</main>

<!-- ===== Footer (components/footer.html) ===== -->
<div id="site-footer"></div>


<!-- Shared navbar + footer -->
<!-- Bootstrap JS (photo lightbox modal) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
<script src="assets/js/components.js"></script>
<!-- Home hero: analog noise + glitch effect on the background video -->
<script src="assets/js/hero-fx.js"></script>
</body>
</html>
